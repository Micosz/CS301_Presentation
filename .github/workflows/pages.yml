name: Validate slides
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and slide content
        run: |
          node --check slides.js
          node --check app.js
          node --check build-offline.mjs
          node validate.mjs
